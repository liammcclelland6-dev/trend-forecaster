[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-trend-bot"
version = "0.1.0"
description = "A local-first fashion signal collection and trend forecasting MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fashion-trends = "fashion_trends.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
